# 문구 풀 초안 (발주사 검수 필수). 규칙이 의도(intent)를 정하고 여기서 문장을 고른다.
# - 존댓말, 생활 언어. 영어·외래어·약어, 아이 달래는 말투, 죄책감·건강 위협·치료 효과 표현 금지(guardrails.yaml로 자동 검사).
# - 자리표시: {minutes} 분, {activity} 운동 이름, {goal} 사용자가 고른 목표, {reason} 날씨 이유
# - 같은 문구는 14일 안에 다시 쓰지 않는다.

