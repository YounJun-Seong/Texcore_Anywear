# 문구 가드레일: 문구 풀과 생성형 AI가 다듬은 문장 모두 이 검사를 통과해야 화면·음성에 나간다.
# 걸리면 AI 문장은 버리고 검수된 원문 템플릿을 쓴다.

categories:
  medical_claim:     # 의료 판단·효과 주장 (원칙 1, 8장 표시·광고)
    - "진단"
    - "치료"
    - "완치"
    - "처방"
    - "약을\\s*(줄|끊|빼|안\\s*드)"
    - "혈압(이|을)\\s*(내려|떨어|낮춰)"
    - "(병|질환)(이|을)\\s*(낫|고쳐)"
  guarantee:         # 감지·안전 보장 문구 (Apple Watch 사례)
    - "감지해\\s*드"
    - "지켜\\s*드립니다"
    - "안전(을|이)\\s*보장"
    - "100\\s*%"
  guilt:             # 죄책감 유발
    - "왜\\s*안\\s*(하|했)"
    - "또\\s*안\\s*(하|했)"
    - "실망"
    - "게으"
    - "핑계"
  threat:            # 건강 위협
    - "큰일"
    - "쓰러지"
    - "나빠지실\\s*거"
    - "후회"
    - "안\\s*하시면"
  jargon:            # 영어·외래어·전문 용어 (3장 용어 원칙)
    - "심박수"
    - "유산소"
    - "근력\\s*운동"
    - "칼로리"
    - "스트레칭"
    - "레벨"
    - "미션"
    - "챌린지"
    - "[A-Za-z]{2,}"
  infantilizing:     # 아이 달래는 말투
    - "옳지"
    - "우쭈쭈"
    - "착하"
    - "잘했어요"
    - "~"
  unresolved:        # 자리표시가 채워지지 않음
    - "[{}]"
