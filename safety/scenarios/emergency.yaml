# 응급 흐름(5-4) 시나리오 정답표. 시간 단위는 초.
# start: {t, severe}  → start_expected: 시작 시 행동
# steps: [t, op, arg] op = answer(true/false) | report_severe | confirm_119 | tick
#        expected: 그 단계에서 나온 [행동, 사유 코드] 목록
# 기준값(초안): "괜찮으세요?" 60초 무응답 → 보호자, 119 발신 확인 30초 무응답 → 보호자에게 119 요청

- id: E001
  desc: 괜찮아요 → 휴식 안내로 끝
  start: {t: 0, severe: false}
  start_expected: [[REST_GUIDANCE, null], [ASK_OK, null]]
  steps:
    - [10, answer, true, [[REST_GUIDANCE, EM_USER_OK]]]
    - [70, tick, null, []]
  final: RESTING_OK

- id: E002
  desc: 아니에요 → 보호자 즉시 알림
  start: {t: 0, severe: false}
  start_expected: [[REST_GUIDANCE, null], [ASK_OK, null]]
