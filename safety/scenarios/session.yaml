# 운동 중 규칙(5-3) 시나리오 정답표. 시간 단위는 초.
#
# ceiling: 오늘 세션 심박 상한(hr_limits 결과를 직접 넣어 이 표를 상한 계산과 분리)
# hr_grade: A | B | C | null(심박 장치 없음)
# events: 시간순. 스트림은 from~to 매초 1건.
#   {hr: 115, from: 0, to: 40}   {tick: true, from: 11, to: 30}
#   {t: 50, rpe: 14}  {t: 50, rpe: hard}  {t: 40, symptom: dizziness}
#   {t: 30, user_stop: true}  {t: 100, interaction: true}  {t: 160, resume: true}
# expected: 세션 전체에서 나온 행동 전부 [t, 행동, 사유 코드] (순서·개수까지 일치해야 통과)
# 기준값(초안): 상한 30초 넘게 초과→천천히, 그 뒤 120초 안에 복귀 못 하면 일시정지,
#   상한×1.10 이상→중단(B 등급은 일시정지), 10초 안에 30bpm 이상 변화→중단,
#   15초 넘게 유효 심박 없음→센서 오류(질문 60초 간격), 확인 질문 180초(장치 없으면 120초), 무응답 180초

- id: S001
  desc: 구간 안에서 꾸준히
  ceiling: 111
  hr_grade: A
  events: [{hr: 100, from: 0, to: 170}]
  expected: []

