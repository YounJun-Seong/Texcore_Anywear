<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>운동친구 · 휴대폰 화면</title>
<style>
/* VS Code 안 브라우저 탭에서 시뮬레이터처럼 보이도록: 휴대폰 틀 + 실제 앱(/app/). 창 크기에 맞춰 줄어든다. */
:root { --bg: #eef1f4; --ink: #0e1726; --ink-2: #5b6675; --frame: #0b0f14; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b1017; --ink: #eef2f7; --ink-2: #8592a3; --frame: #000; } }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  display: grid; place-items: center; overflow: hidden; }
.wrap { display: grid; justify-items: center; gap: 10px; transform-origin: center center; }
.device { width: 414px; height: 862px; background: var(--frame); border-radius: 54px; padding: 12px; box-sizing: border-box; position: relative;
  box-shadow: 0 0 0 2px #2a3240, 0 30px 70px -30px rgba(0,0,0,.6); }
.device::before { content: ""; position: absolute; top: 22px; left: 50%; transform: translateX(-50%); width: 104px; height: 30px; background: var(--frame); border-radius: 20px; z-index: 2; pointer-events: none; }
.screen { width: 390px; height: 838px; border-radius: 42px; overflow: hidden; background: #f2f4f7; display: flex; flex-direction: column; }
.sbar { height: 52px; flex: none; display: flex; justify-content: space-between; align-items: center; padding: 6px 30px 0; font: 600 15px -apple-system, "Segoe UI", sans-serif; color: #0e1726; }
iframe { width: 390px; flex: 1; border: 0; display: block; background: #f2f4f7; }
.bar { font-size: 13px; color: var(--ink-2); display: flex; gap: 14px; }
.bar a { color: inherit; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="device"><div class="screen"><div class="sbar"><span id="clock">9:41</span><span>●●● 5G ▮</span></div><iframe src="/app/" title="운동친구 앱"></iframe></div></div>
  <div class="bar"><span>실제 앱 · 서버·가상 워치 연결</span><a href="/app/" target="_blank">앱만 크게</a><a href="/demo">HTML 시연</a><a href="#" id="reload">처음부터</a></div>
</div>
<script>
// 창 높이에 맞게 휴대폰 틀 전체를 줄인다
function fit() {
  const s = Math.min(1, (innerHeight - 24) / 900, (innerWidth - 24) / 440);
  document.getElementById('wrap').style.transform = `scale(${s})`;
}
addEventListener('resize', fit); fit();
const tick = () => { const d = new Date(); document.getElementById('clock').textContent = `${d.getHours() % 12 || 12}:${String(d.getMinutes()).padStart(2, '0')}`; };
tick(); setInterval(tick, 10000);
document.getElementById('reload').onclick = e => { e.preventDefault(); document.querySelector('iframe').src = '/app/'; };
</script>
</body>
</html>
